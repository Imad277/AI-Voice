# VoiceOS Phase 0 – local development database only. Not a production deployment.
#
# PostgreSQL 18.6 (official image): current supported major line, used only for
# local tenant-isolation (RLS) tests. Bound to 127.0.0.1 so it is never exposed
# on the network. Passwords come from the git-ignored `.env` (see `.env.example`).
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: voiceos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      VOICEOS_MIGRATOR_PASSWORD: ${VOICEOS_MIGRATOR_PASSWORD:?set VOICEOS_MIGRATOR_PASSWORD in .env}
      VOICEOS_APP_PASSWORD: ${VOICEOS_APP_PASSWORD:?set VOICEOS_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${VOICEOS_PG_PORT:-55432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - voiceos-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voiceos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  voiceos-pgdata:
